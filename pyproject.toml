[project]
name = "iphone-clawdmeter"
version = "0.1.0"
description = "Clawdmeter-style Claude Code usage display on an old iPhone, over USB"
requires-python = ">=3.12"
dependencies = [
    "pymobiledevice3",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
